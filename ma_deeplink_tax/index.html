<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>General Department of Taxation - E-Filing</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f1f5f9;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }
    .card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
      padding: 32px;
      max-width: 440px;
      text-align: center;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      background: #ecfdf5;
      color: #059669;
      margin-bottom: 16px;
    }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { color: #64748b; font-size: 14px; margin-bottom: 24px; }
    .btn {
      display: block;
      background: #2563eb;
      color: white;
      text-decoration: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: 500;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Official Government Service</div>
    <h1>General Department of Taxation</h1>
    <p>Opening Cambodia E-Tax Declarations in the native app...</p>
    <a href="cambodia-tax://declarations/new" class="btn">Launch in GDT App</a>
  </div>
</body>
</html>
