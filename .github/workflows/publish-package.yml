name: Publish Flutter Package to Nexus

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    name: Test & Publish to Nexus
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: dsp_miniapp_trust_regulator
        run: flutter pub get

      - name: Run code analysis
        working-directory: dsp_miniapp_trust_regulator
        run: dart analyze --no-fatal-infos

      - name: Run unit tests
        working-directory: dsp_miniapp_trust_regulator
        run: |
          if [ -d "test" ]; then
            flutter test
          else
            echo "No unit tests found. Skipping."
          fi

      - name: Security Gate 1 Integrity Checksum
        working-directory: dsp_miniapp_trust_regulator
        run: |
          echo "Generating package checksum..."
          sha256sum pubspec.yaml > checksum.sha256
          cat checksum.sha256

      - name: Authenticate & Publish to Private Nexus
        working-directory: dsp_miniapp_trust_regulator
        env:
          NEXUS_TOKEN: ${{ secrets.NEXUS_AUTH_TOKEN }}
          NEXUS_HOSTED_URL: 'https://nd40vsdk-8081.asse.devtunnels.ms/repository/pub-hosted/'
        run: |
          echo "Configuring Nexus credentials..."
          dart pub token add "$NEXUS_HOSTED_URL" --env-var NEXUS_TOKEN
          echo "Publishing package..."
          dart pub publish --force
