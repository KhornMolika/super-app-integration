<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FSA Super App • Mobile Simulator</title>
  <link rel="icon" type="image/png" href="/favicon.png"/>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background: radial-gradient(ellipse at top, #0f172a, #020617, #000000);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }
    header {
      height: 56px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 10;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 700;
    }
    .badge {
      background: rgba(99, 102, 241, 0.2);
      color: #a5b4fc;
      border: 1px solid rgba(99, 102, 241, 0.4);
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      text-decoration: none;
    }
    .btn:hover {
      background: rgba(51, 65, 85, 0.9);
      color: #fff;
    }
    .btn-primary {
      background: #4f46e5;
      border-color: #6366f1;
      color: #fff;
      font-weight: 600;
    }
    .btn-primary:hover {
      background: #4338ca;
    }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
    }
    .device-wrapper {
      position: relative;
      transition: transform 0.3s ease-out;
    }
    .device-frame {
      width: 393px;
      height: 852px;
      background: #000;
      border-radius: 50px;
      padding: 12px;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.9), 0 0 0 10px #1e1e24, 0 0 0 12px rgba(255, 255, 255, 0.1);
      position: relative;
      display: flex;
      flex-direction: column;
    }
    .screen {
      width: 100%;
      height: 100%;
      border-radius: 38px;
      overflow: hidden;
      position: relative;
      background: #fff;
    }
    .status-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 5;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      pointer-events: none;
    }
    .dynamic-island {
      width: 120px;
      height: 30px;
      background: #000;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
    }
    .camera {
      width: 10px;
      height: 10px;
      background: #111;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .home-bar {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 130px;
      height: 5px;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 10px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <a href="/" class="btn" style="padding: 4px 8px;">← BackOffice</a>
      <span>FSA Super App</span>
      <span class="badge">Mobile Simulator</span>
    </div>
    <div class="controls">
      <button class="btn" onclick="reloadFrame()">🔄 Reload</button>
      <a href="/api/download-apk?type=test&version=v0.0.1" class="btn btn-primary">📲 Download APK</a>
    </div>
  </header>

  <main id="container">
    <div class="device-wrapper" id="wrapper">
      <div class="device-frame">
        <div class="screen">
          <div class="status-bar">
            <span id="clock">09:41</span>
            <div class="dynamic-island">
              <div class="camera"></div>
            </div>
            <span>5G 🔋</span>
          </div>
          <iframe id="sandboxFrame" src="/superapp-sandbox/index.html"></iframe>
          <div class="home-bar"></div>
        </div>
      </div>
    </div>
  </main>

  <script>
    function updateClock() {
      const d = new Date();
      const h = String(d.getHours()).padStart(2, '0');
      const m = String(d.getMinutes()).padStart(2, '0');
      document.getElementById('clock').textContent = `${h}:${m}`;
    }
    updateClock();
    setInterval(updateClock, 10000);

    function reloadFrame() {
      const frame = document.getElementById('sandboxFrame');
      frame.src = '/superapp-sandbox/index.html?t=' + Date.now();
    }

    function autoScale() {
      const container = document.getElementById('container');
      const wrapper = document.getElementById('wrapper');
      const availH = container.clientHeight - 40;
      const targetH = 852 + 24;
      const scale = Math.min(availH / targetH, 1);
      wrapper.style.transform = `scale(${Math.max(scale, 0.45)})`;
    }
    window.addEventListener('resize', autoScale);
    autoScale();
  </script>
</body>
</html>
