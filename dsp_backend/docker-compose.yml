version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: dsp-postgres
    environment:
      POSTGRES_USER: dsp_user
      POSTGRES_PASSWORD: dsp_password
      POSTGRES_DB: dsp_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: