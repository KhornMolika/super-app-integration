apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: super-app-backend-ingress
  namespace: super-app
spec:
  ingressClassName: traefik
  rules:
  - host: app.fintechcenterfsa.com
    http:
      paths:
      - path: /api/mobile
        pathType: Prefix
        backend:
          service:
            name: super-app-backend-svc
            port:
              number: 3000
      - path: /socket.io
        pathType: Prefix
        backend:
          service:
            name: super-app-backend-svc
            port:
              number: 3000
      - path: /api/release-assembly
        pathType: Prefix
        backend:
          service:
            name: super-app-backend-svc
            port:
              number: 3000
      - path: /release-assembly
        pathType: Prefix
        backend:
          service:
            name: super-app-backend-svc
            port:
              number: 3000
