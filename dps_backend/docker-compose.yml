services:
  postgres:
    image: postgres:15
    container_name: dps-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-${DB_USERNAME:-admin}}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-${DB_PASSWORD:-admin1234}}
      POSTGRES_DB: ${POSTGRES_DB:-${DB_DATABASE:-dps_db}}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  nexus:
    image: sonatype/nexus3:latest
    container_name: nexus
    restart: unless-stopped
    ports:
      - '${NEXUS_PORT:-8081}:8081'
    volumes:
      - nexus-data:/nexus-data

  minio:
    image: ${MINIO_IMAGE:-quay.io/minio/aistor/minio:RELEASE.2026-09-07T08-39-31Z}
    container_name: dps-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-admin1234}
      MINIO_SUBNET_LICENSE: ${MINIO_SUBNET_LICENSE:-}
      MINIO_AISTOR_LICENSE: ${MINIO_SUBNET_LICENSE:-}
      MINIO_LICENSE: ${MINIO_SUBNET_LICENSE:-}
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    container_name: dps-minio-init
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-admin1234}
      MINIO_SUBNET_LICENSE: ${MINIO_SUBNET_LICENSE:-}
    volumes:
      - ./scripts/minio-init.sh:/minio-init.sh:ro
    entrypoint: ["/bin/sh", "/minio-init.sh"]

volumes:
  pgdata:
  nexus-data:
  minio_data:
