version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: dps-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dps_user
      POSTGRES_PASSWORD: dps_password
      POSTGRES_DB: dps_db
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  nexus:
    image: sonatype/nexus3:latest
    container_name: nexus
    restart: unless-stopped

    ports:
      - '8081:8081'

    volumes:
      - nexus-data:/nexus-data

  minio:
    image: minio/minio:latest
    container_name: dps-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: adminadmin
      MINIO_SUBNET_LICENSE: "eyJhbGciOiJFUzM4NCIsInR5cCI6IkpXVCJ9..EkNQ786hp_ScpmgL3bZMtfjUXePrHLczVDi-BoigJZF8gOcuro9uxeNdKgGzdtnOhL-T_VlVJoMWNR_-4io8MdVwmQ7hkNk5AmimPIYBip100gLapgi5xd5TN0sreUVb"
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    container_name: dps-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 2;
      /usr/bin/mc alias set myminio http://minio:9000 admin adminadmin;
      /usr/bin/mc mb myminio/mini-app-logos --ignore-existing;
      /usr/bin/mc anonymous set download myminio/mini-app-logos;
      /usr/bin/mc mb myminio/releases --ignore-existing;
      /usr/bin/mc anonymous set download myminio/releases;
      exit 0;
      "

volumes:
  pgdata:
  nexus-data:
  minio_data:
