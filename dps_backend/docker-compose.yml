services:
  postgres:
    image: postgres:15
    container_name: dps-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-${DB_USERNAME}}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-${DB_PASSWORD}}
      POSTGRES_DB: ${POSTGRES_DB:-${DB_DATABASE}}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  nexus:
    image: sonatype/nexus3:latest
    container_name: nexus
    restart: unless-stopped
    ports:
      - '${NEXUS_PORT:-8081}:8081'
    volumes:
      - nexus-data:/nexus-data

  minio:
    image: minio/minio:latest
    container_name: dps-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_SUBNET_LICENSE: ${MINIO_SUBNET_LICENSE}
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    container_name: dps-minio-init
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_SUBNET_LICENSE: ${MINIO_SUBNET_LICENSE}
    entrypoint: >
      /bin/sh -c "
      sleep 2;
      /usr/bin/mc alias set myminio http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      
      # 1. Public bucket for UI assets (logos/banners)
      /usr/bin/mc mb myminio/mini-app-logos --ignore-existing;
      /usr/bin/mc anonymous set download myminio/mini-app-logos;

      # 2. Strictly PRIVATE quarantine bucket for untrusted uploaded packages
      /usr/bin/mc mb myminio/submissions --ignore-existing;
      exit 0;
      "

volumes:
  pgdata:
  nexus-data:
  minio_data:
