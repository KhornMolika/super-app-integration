version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: dps-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dps_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dps_password}
      POSTGRES_DB: ${POSTGRES_DB:-dps_db}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  nexus:
    image: sonatype/nexus3:latest
    container_name: nexus
    restart: unless-stopped
    ports:
      - '${NEXUS_PORT:-8081}:8081'
    volumes:
      - nexus-data:/nexus-data

  minio:
    image: minio/minio:latest
    container_name: dps-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-adminadmin}
      MINIO_SUBNET_LICENSE: ${MINIO_SUBNET_LICENSE:-}
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    container_name: dps-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 2;
      /usr/bin/mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER:-admin} $${MINIO_ROOT_PASSWORD:-adminadmin};
      /usr/bin/mc mb myminio/mini-app-logos --ignore-existing;
      /usr/bin/mc anonymous set download myminio/mini-app-logos;
      /usr/bin/mc mb myminio/releases --ignore-existing;
      /usr/bin/mc anonymous set download myminio/releases;
      exit 0;
      "

volumes:
  pgdata:
  nexus-data:
  minio_data:
