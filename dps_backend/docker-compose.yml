version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: dps-postgres
    environment:
      POSTGRES_USER: dps_user
      POSTGRES_PASSWORD: dps_password
      POSTGRES_DB: dps_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: